services:
  db:
    image: postgres:16
    container_name: dealership-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealer
      POSTGRES_PASSWORD: dealerpass
      POSTGRES_DB: dealership
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealer -d dealership"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: