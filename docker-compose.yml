services:
  db:
    image: postgres:16
    container_name: dealership-db
    restart: unless-stopped
    # Credentials come from the gitignored .env in this directory, which
    # Docker Compose loads automatically. Copy .env.example to .env and set
    # real values; nothing secret belongs in this file.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      # $$ so the variable is expanded by the shell inside the container,
      # not by Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
